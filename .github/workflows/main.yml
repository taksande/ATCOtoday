name: Maximo CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate package
        run: |
          echo "Validating Maximo package..."

          find . -maxdepth 3 -type f | sort

          echo "Validation completed"


  build:
    name: Build Maximo Package
    runs-on: ubuntu-latest
    needs: validate

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Create package directory
        run: |
          mkdir -p build

      - name: Create Maximo package
        run: |
          echo "Creating Maximo package..."

          zip -r build/maximo-package.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "build/*"

      - name: Verify package
        run: |
          ls -lh build/
          unzip -l build/maximo-package.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: maximo-package
          path: build/maximo-package.zip
